<!DOCTYPE html>
<html>
    <head>
        <style>
            #first{
                width: 33%;
                height: 300px;
                object-fit: cover;
                border-radius: 18px;
            }
            #second{
                vertical-align: top;
                height: 150px;
                width: 150px;
                border: solid 2px black;
                border-radius: 50%;
                padding: 2px;
            }
            #third{
                width: 33%;
                height: 300px;
                object-fit: fill;
            }
            body{
                font-size: 0px;
            }
        </style>
    </head>
    <body>
        <img id="first" src="https://upload.wikimedia.org/wikipedia/commons/7/75/Plumbeous_Water_Redstart_%28male%29.JPG">
        <img id="second" src="https://upload.wikimedia.org/wikipedia/commons/7/79/Spilopelia_chinensis_Zhengzhou_20210607.jpg">
        <img id="third" src="https://upload.wikimedia.org/wikipedia/commons/7/75/Plumbeous_Water_Redstart_%28male%29.JPG">
    </body>
</html>
